<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EviOmri — roster backoffice</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --bg: #050711; --panel: #10182b; --line: #1d2740; --line2: #344861; --text: #f3f4e8; --muted: #9bb1c9; --dim: #6b7a99; --accent: #ffcf5c; --cyan: #75f5dc; --pink: #ff4f72; --green: #3ddc84; --purple: #bd8cff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 15px; color: var(--accent); letter-spacing: 1px; }
  header h1 small { color: var(--dim); font-weight: normal; letter-spacing: 0; margin-left: 8px; }
  header nav a { color: var(--cyan); margin-right: 12px; }
  header .spacer { flex: 1; }
  button { font: inherit; padding: 6px 14px; border-radius: 4px; border: 1px solid var(--line2); background: #14243d; color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--cyan); }
  button.primary { background: var(--cyan); color: #0b1730; border-color: var(--cyan); font-weight: bold; }
  button.primary[disabled] { opacity: .45; cursor: default; }
  #status { color: var(--muted); min-width: 12em; }
  #status.err { color: var(--pink); }
  #status.ok { color: var(--green); }
  main { padding: 12px 16px 60px; max-width: 1700px; margin: 0 auto; }
  #tabs { display: flex; gap: 4px; margin: 6px 0 14px; border-bottom: 1px solid var(--line); }
  #tabs button { background: none; border: 1px solid transparent; border-bottom: none; border-radius: 4px 4px 0 0; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; padding: 8px 16px; }
  #tabs button.on { color: var(--accent); border-color: var(--line); background: var(--panel); }
  #tabs .count { color: var(--dim); letter-spacing: 0; margin-left: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; transition: opacity .15s; }
  .card.out { opacity: .45; }
  .card.out:hover { opacity: .8; }
  .card canvas { width: 100%; aspect-ratio: 1.15; image-rendering: pixelated; background: #0b1020 radial-gradient(ellipse at 50% 85%, #182238 0, #0b1020 65%); border-radius: 4px; display: block; }
  .card canvas.loading { animation: pulse 1s ease-in-out infinite alternate; }
  .card canvas.failed { outline: 1px solid var(--pink); }
  @keyframes pulse { from { opacity: .35; } to { opacity: .7; } }
  .card .actions { display: flex; gap: 4px; }
  .card .actions select { flex: 1; min-width: 0; font: inherit; font-size: 11px; padding: 3px 4px; border-radius: 3px; border: 1px solid var(--line2); background: #0b1020; color: var(--muted); }
  .card .actions button { padding: 3px 8px; font-size: 11px; color: var(--muted); }
  .card .actions button.on { color: var(--cyan); border-color: var(--cyan); }
  .card .head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .card .id { flex: 1; min-width: 0; color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; border: 1px solid; white-space: nowrap; }
  .badge.hero { color: var(--cyan); border-color: var(--cyan); }
  .badge.enemy { color: var(--accent); border-color: var(--accent); }
  .badge.boss { color: var(--pink); border-color: var(--pink); }
  .badge.variant { color: var(--purple); border-color: var(--purple); }
  .badge.note { color: var(--dim); border-color: var(--line2); }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; }
  label.toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; color: var(--muted); }
  label.toggle input { accent-color: var(--cyan); width: 15px; height: 15px; margin: 0; }
  input.name { font: inherit; font-weight: bold; width: 100%; padding: 5px 7px; border-radius: 4px; border: 1px solid var(--line2); background: #0b1020; color: var(--text); }
  input.name:focus { outline: none; border-color: var(--cyan); }
  .levels { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
  .levels button { padding: 3px 0; font-size: 11px; border-radius: 3px; background: #0b1020; color: var(--dim); border-color: var(--line); }
  .levels button.on { background: #1f3350; color: var(--text); border-color: var(--cyan); }
  .levels button.taken { color: #55637e; text-decoration: line-through; }
  .hint { color: var(--dim); font-size: 11px; }
  .pill { display: inline-block; font-size: 10px; font-weight: bold; letter-spacing: 1px; padding: 1px 7px; border-radius: 3px; vertical-align: middle; }
  .pill.ready { background: #123a2a; color: var(--green); }
  .pill.failed { background: #3a1220; color: var(--pink); }
  .pill.legacy { background: #2b2a12; color: var(--accent); }
  .pill.checking, .pill.unknown { background: #1a2238; color: var(--dim); }
  .pill.reuse { background: #241a3a; color: var(--purple); }
  .card .status { font-size: 11px; color: var(--muted); line-height: 1.5; }
  .card .status .why { color: var(--dim); }
  .card .status details { margin-top: 2px; }
  .card .status summary { cursor: pointer; color: var(--pink); }
  .card .status ul { margin: 4px 0 0; padding-left: 16px; color: var(--muted); }
  .card .status code { color: var(--cyan); font-size: 10px; }
  .card[data-ready="failed"] { border-color: #5a2030; }
  .card[data-ready="ready"] { border-color: #1f5a3a; }
  #readiness { margin: 0 0 10px; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
  .lvl .wave span.ready { color: var(--green); }
  .lvl .wave span.failed, .lvl .wave span.legacy { color: var(--accent); }
  #board { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .lvl { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 11px; }
  .lvl b { display: block; color: var(--text); font-size: 12px; margin-bottom: 2px; }
  .lvl .boss { color: var(--pink); margin: 4px 0 6px; display: flex; align-items: center; gap: 6px; }
  .lvl .boss img { width: 32px; height: 32px; image-rendering: pixelated; border-radius: 3px; background: #0b1020; }
  .lvl .wave { color: var(--muted); }
  .lvl .wave span { color: var(--accent); }
  #warnings { color: var(--accent); white-space: pre-line; margin: 8px 0; }
  #warnings:empty { display: none; }
  details.raw { margin-top: 24px; color: var(--dim); }
  details.raw textarea { width: 100%; height: 220px; font: 11px/1.4 ui-monospace, Menlo, monospace; background: #0b1020; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
</style>
</head>
<body>
<header>
  <h1>EVIOMRI BACKOFFICE <small>roster · who takes part, under what name, on which level</small></h1>
  <nav><a href="/">game</a><a href="/showcase.html">showcase</a></nav>
  <span class="spacer"></span>
  <span id="status">loading…</span>
  <button id="reset">Reset to defaults</button>
  <button id="auto" title="enable only characters whose art passes the standard; ready bosses are dealt across the ten levels">Ready only</button>
  <button id="save" class="primary" disabled>Save roster</button>
</header>
<main>
  <div id="tabs">
    <button data-tab="hero" class="on">Heroes <span class="count" id="c-hero"></span></button>
    <button data-tab="enemy">Enemies <span class="count" id="c-enemy"></span></button>
    <button data-tab="boss">Bosses <span class="count" id="c-boss"></span></button>
    <button data-tab="campaign">Campaign</button>
  </div>
  <div id="readiness"></div>
  <div id="warnings"></div>
  <div class="grid" id="grid"></div>
  <div id="campaign" hidden>
    <p class="hint">What each level fields with this roster — the boss it ends on and the enemies in each wave.</p>
    <div id="board"></div>
    <details class="raw"><summary>roster.json</summary><textarea id="raw" readonly></textarea></details>
  </div>
</main>
<script type="module" src="/src/backoffice/main.ts"></script>
</body>
</html>
