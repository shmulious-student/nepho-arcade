<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>EviOmri: Circuit Breakers</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; padding: 0; background: #050711; color: #f3f4e8; font-family: monospace; overflow: hidden; height: 100%; }
    /* iOS Safari's collapsible toolbar changes the *visible* viewport height after load without
       firing a normal resize in time for the very first layout — sizing #app against 100vh (which
       resolves against the taller "layout viewport", including the area the toolbar covers) leaves
       Phaser's FIT scale computing a canvas taller than what's actually visible, with no scroll to
       reach the cropped-off bottom. 100dvh tracks the real visible area; keep 100vh only as a
       fallback for browsers that don't support dvh yet. */
    #app { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; }
    #app canvas { touch-action: none; }
    /* Phones held upright: the game is landscape-only; ask for a turn instead of showing a sliver. */
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #050711; color: #f3f4e8; align-items: center; justify-content: center; text-align: center; font-size: 18px; line-height: 1.6; font-family: Arial, sans-serif; }
    #rotate .en { color: #9bb1c9; font-size: 15px; }
    #rotate b { color: #75f5dc; }
    @media (pointer: coarse) and (orientation: portrait) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="rotate"><div><b>EVIOMRI</b><br><span dir="rtl">סובבו את הטלפון לרוחב</span><br><span class="en">turn your phone sideways</span><br><span style="font-size:40px">📱↻</span></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
