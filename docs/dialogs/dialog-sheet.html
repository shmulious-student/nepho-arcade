<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EviOmri Dialog Sheet</title>
<style>
:root{--ground:#0b1730;--panel:#14243d;--line:#344861;--ink:#f3f4e8;--muted:#9bb1c9;--gold:#ffcf5c;--pink:#ff4f72;--cyan:#75f5dc}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;padding:0 16px 120px}
h1{font-size:22px;margin:24px 0 4px;color:var(--gold)}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.toolbar{position:sticky;top:0;z-index:5;background:rgba(11,23,48,.96);padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
button.primary{background:var(--gold);color:#10182b;border-color:var(--gold);font-weight:600}
.status{font-size:12px;color:var(--muted);flex-basis:100%}
.level{margin:22px 0 0;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:8px;background:var(--panel);padding:10px 12px 4px}
.level h2{font-size:18px;margin:2px 0 0}
.level .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
details{border-top:1px solid #25395a;padding:8px 0}
summary{cursor:pointer;font-weight:600;font-size:15px}
summary .flags{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.line{margin:10px 0 14px;padding-left:10px;border-left:3px solid var(--line)}
.line.hero{border-color:var(--cyan)}.line.boss{border-color:var(--pink)}.line.pitz{border-color:#35e8ff}.line.player{border-color:#a4ee42}
.who{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.who select{padding:2px 6px;font-size:12px}
textarea{width:100%;min-height:52px;font:inherit;font-size:15px;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:6px;resize:vertical}
textarea[dir=rtl]{text-align:right}
textarea.dirty{border-color:var(--gold)}
.hint{font-size:12px;color:var(--muted)}
.swap{margin-top:8px;padding:8px;border:1px dashed var(--line);border-radius:6px}
.swap .hint{margin-bottom:4px}
#out{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Menlo,monospace;margin-top:8px}
.lang-he .en,.lang-en .he{display:none}
</style>
</head>
<body>
<h1>EviOmri dialog sheet</h1>
<p class="sub">Every scene of every level: who walks in and what they say. Edit any line — edits stay on this phone until you export them. Bring the exported JSON back to the project and run <code>node tools/dialog-sheet.mjs --apply file.json</code>.</p>
<div class="toolbar">
  <button type="button" id="langEn">English</button>
  <button type="button" id="langHe">עברית</button>
  <button type="button" id="langBoth">Both</button>
  <button type="button" class="primary" id="export">Export edits</button>
  <button type="button" id="copy">Copy</button>
  <button type="button" id="share">Share</button>
  <button type="button" id="reset">Reset all</button>
  <span class="status" id="status"></span>
</div>
<div id="root"></div>
<textarea id="out" readonly placeholder="Export edits fills this with JSON you can copy, share or save."></textarea>
<script id="data" type="application/json">{"data":[{"id":"rishon","index":1,"name":["Rishon LeZion","ראשון לציון"],"boss":"ferryman","waves":3,"scenes":[{"key":"start","title":"Opening","hero":"shmuel","join":false,"ifPlayed":"keep","lines":[{"who":"shmuel","en":"Hi. I am Shmuel, and before anything else: this is a game. Nothing here is real. Not the punks, not the bosses, not the bruises.","he":"היי. אני שמואל, ולפני הכול: זה משחק. שום דבר פה לא אמיתי. לא הפאנקים, לא הבוסים, לא המכות."},{"who":"shmuel","en":"You do not have to like it, and you do not have to play it. Stop whenever you want. Nothing bad happens.","he":"לא חייבים לאהוב אותו, ולא חייבים לשחק בו. אפשר להפסיק מתי שרוצים. שום דבר רע לא קורה."},{"who":"shmuel","en":"The story: Eviatar and Omri are looking for Adi and Abir, their mom and dad. They are safe.","he":"הסיפור: אביתר ועומרי מחפשים את עדי ואביר, אמא ואבא. הם בטוחים."},{"who":"shmuel","en":"They are just somewhere along this road, and we will find them, one clue at a time.","he":"הם פשוט איפשהו לאורך הדרך, ואנחנו נמצא אותם, רמז אחרי רמז."},{"who":"shmuel","en":"This is HaSarig Street, our street. Light is J, heavy is K, three lights in a row spin all the way round. Go on, clear the road.","he":"זה רחוב השריג, הרחוב שלנו. מכה קלה ב-J, כבדה ב-K, שלוש קלות ברצף מסתובבות סביב. קדימה, לפנות את הדרך."},{"who":"player","en":"On it!","he":"על זה!"}],"swapLines":null},{"key":"boss","title":"Before the boss","hero":"shmuel","join":true,"ifPlayed":"keep","lines":[{"who":"shmuel","en":"Hold on. The ground is shaking. That is not a punk, that is the first boss. Remember: just a game.","he":"רגע. הרצפה רועדת. זה לא פאנק, זה הבוס הראשון. תזכרו: רק משחק."},{"who":"boss","en":"Looking for your mother and father? The Ferryman knows every road. Pay the toll and I might tell you.","he":"מחפשים את אמא ואבא? המעבורן מכיר כל דרך. שלמו את האגרה ואולי אספר."},{"who":"shmuel","en":"We do not pay on our street. I am staying for this one. Let's go!","he":"אצלנו ברחוב לא משלמים. אני נשאר לקרב הזה. קדימה!"}],"swapLines":null},{"key":"end","title":"After the boss","hero":"noa","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"Fine... the clinic... Refael Eitan Street... she was there...","he":"טוב... קופת החולים... רחוב רפאל איתן... היא הייתה שם..."},{"who":"pitz","en":"Meow. Meow-meow.","he":"מיאו. מיאו-מיאו."},{"who":"noa","en":"Pitz says the Ferryman dropped a note. A clinic receipt with Adi's name, and a smiley on it. She is fine.","he":"פיץ אומר שהמעבורן הפיל פתק. קבלה מהקופה עם השם של עדי, וסמיילי עליה. היא בסדר."},{"who":"noa","en":"First clue! Next stop, Refael Eitan Street. Saba Kobi is waiting there with the newspaper.","he":"רמז ראשון! התחנה הבאה, רחוב רפאל איתן. סבא קובי מחכה שם עם העיתון."}],"swapLines":null}]},{"id":"petah-tikva","index":2,"name":["Refael Eitan Street","רחוב רפאל איתן"],"boss":"monk-zero","waves":3,"scenes":[{"key":"start","title":"Opening","hero":"saba-kobi","join":false,"ifPlayed":"keep","lines":[{"who":"saba-kobi","en":"Refael Eitan Street! Adi was at the clinic this morning. Perfectly healthy, the nurse said. She just went on ahead.","he":"רחוב רפאל איתן! עדי הייתה בקופת החולים הבוקר. בריאה לגמרי, אמרה האחות. היא פשוט המשיכה הלאה."},{"who":"saba-kobi","en":"And Abir? Abir called from somewhere with drums. We will get to that. First, these punks, and a Gold Sorceress who throws things.","he":"ואביר? אביר התקשר ממקום עם תופים. נגיע לזה. קודם, הפאנקים האלה, ומכשפת זהב שזורקת דברים."},{"who":"saba-kobi","en":"Dash out of her way: hold L and push sideways. Ha!","he":"תתחמקו ממנה בריצה: מחזיקים L ודוחפים הצידה. חה!"}],"swapLines":null},{"key":"boss","title":"Before the boss","hero":"savta-orly","join":false,"ifPlayed":"keep","lines":[{"who":"savta-orly","en":"Wait, wait, I brought soup. Nobody fights a boss on an empty stomach. And I have news: Adi left me a message. She is fine, she is with Abir.","he":"רגע, רגע, הבאתי מרק. אף אחד לא נלחם בבוס על בטן ריקה. ויש לי חדשות: עדי השאירה לי הודעה. היא בסדר, היא עם אביר."},{"who":"boss","en":"Monk Zero needs no soup. Only silence. Your parents passed my street. I let them. You, I will not.","he":"מונק זירו לא צריך מרק. רק שקט. ההורים שלכם עברו ברחוב שלי. להם נתתי. לכם לא."},{"who":"savta-orly","en":"Silence? In this family? Good luck with that. Watch his orbs, sweetheart.","he":"שקט? במשפחה הזאת? בהצלחה עם זה. תיזהרו מהכדורים שלו, מותק."}],"swapLines":null},{"key":"end","title":"After the boss","hero":"noa","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...so loud... the gym... they went to the gym with the drums...","he":"...כל כך רועש... המכון... הם הלכו למכון עם התופים..."},{"who":"noa","en":"Drums! That is Omri's capoeira gym. Abir forgot his gym bag there, he always does.","he":"תופים! זה מכון הקפוארה של עומרי. אביר שכח שם את תיק הספורט שלו, הוא תמיד שוכח."},{"who":"noa","en":"Second clue. Off to Academia Ginga. Eviatar wants to show you something on the way.","he":"רמז שני. יוצאים לאקדמיה ז'ינגה. אביתר רוצה להראות לכם משהו בדרך."}],"swapLines":null}]},{"id":"capoeira-gym","index":3,"name":["Capoeira gym","מכון הקפוארה"],"boss":"kilnheart","waves":4,"scenes":[{"key":"start","title":"Opening","hero":"eviatar","join":false,"ifPlayed":"swap","lines":[{"who":"eviatar","en":"Omri's gym, Academia Ginga. Look: Abir's bag on the bench, and a note. \"Went to buy pastries with Adi. Back soon. Love you.\"","he":"המכון של עומרי, אקדמיה ז'ינגה. תראו: התיק של אביר על הספסל, ופתק. \"הלכנו לקנות מאפים עם עדי. חוזרים. אוהבים.\""},{"who":"eviatar","en":"See? Safe. We just keep following. Bio-Brutes are slow but hit like a truck. Jump kicks floor them: SPACE, then J in the air.","he":"רואים? בטוחים. פשוט ממשיכים לעקוב. ביו-ברוטים איטיים אבל מכים כמו משאית. בעיטה מקפיצה מפילה אותם: SPACE ואז J באוויר."}],"swapLines":[{"who":"eviatar","en":"Omri's gym, Academia Ginga. Look: Abir's bag on the bench, and a note. \"Went to buy pastries with Adi. Back soon. Love you.\"","he":"המכון של עומרי, אקדמיה ז'ינגה. תראו: התיק של אביר על הספסל, ופתק. \"הלכנו לקנות מאפים עם עדי. חוזרים. אוהבים.\""},{"who":"eviatar","en":"I am reading the clues on this level, so {new} takes the floor. You get me back next level.","he":"אני קורא את הרמזים בשלב הזה, אז {new} על הרצפה. בשלב הבא אני חוזר אליכם."},{"who":"eviatar","en":"Bio-Brutes are slow but hit like a truck. Jump kicks floor them: SPACE, then J in the air.","he":"ביו-ברוטים איטיים אבל מכים כמו משאית. בעיטה מקפיצה מפילה אותם: SPACE ואז J באוויר."}]},{"key":"boss","title":"Before the boss","hero":"eviatar","join":false,"ifPlayed":"keep","lines":[{"who":"eviatar","en":"Feel that heat? Something is coming through the back wall.","he":"מרגישים את החום? משהו עובר דרך הקיר האחורי."},{"who":"boss","en":"Kilnheart. I turn gyms into ovens. Your parents bought their pastries and left. Lucky them.","he":"קילנהארט. אני הופך מכונים לתנורים. ההורים שלכם קנו מאפים והלכו. מזל שלהם."},{"who":"eviatar","en":"Pastries. Got it. When he charges, jump. When the floor glows, move.","he":"מאפים. הבנתי. כשהוא מסתער, קופצים. כשהרצפה זוהרת, זזים."}],"swapLines":null},{"key":"end","title":"After the boss","hero":"omri","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...cooling... down...","he":"...מתקרר..."},{"who":"omri","en":"MY GYM! You saved my gym! Axé! And look what fell out of his pocket: a pastry-shop receipt from Sant Cugat.","he":"המכון שלי! הצלתם את המכון שלי! אשה! ותראו מה נפל לו מהכיס: קבלה מקונדיטוריה בסנט קוגט."},{"who":"omri","en":"Third clue! Sant Cugat. The big square, the monastery, and the best xuixos in the world.","he":"רמז שלישי! סנט קוגט. הכיכר הגדולה, המנזר, והשוישו הכי טוב בעולם."}],"swapLines":null}]},{"id":"sant-cugat","index":4,"name":["Sant Cugat","סנט קוגט"],"boss":"market-king","waves":3,"scenes":[{"key":"start","title":"Opening","hero":"eviatar","join":false,"ifPlayed":"keep","lines":[{"who":"eviatar","en":"Plaça d'Octavià. The waiter says Adi and Abir sat right here an hour ago, laughing, with two coffees. They are fine.","he":"פלאסה ד'אוקטביה. המלצר אומר שעדי ואביר ישבו ממש כאן לפני שעה, צוחקים, עם שני קפה. הם בסדר."},{"who":"eviatar","en":"Then Rainbow Oracles filled the square. They dodge a lot. Do not chase. Wait for them to come to you, then land the third light.","he":"ואז אורקלי קשת מילאו את הכיכר. הם מתחמקים המון. לא לרדוף. חכו שיבואו אליכם, ואז המכה השלישית."}],"swapLines":null},{"key":"boss","title":"Before the boss","hero":"omri","join":true,"ifPlayed":"keep","lines":[{"who":"omri","en":"Hey! Sorry I am late, I was doing cartwheels down Carrer Major. I asked everyone: they went towards Barcelona!","he":"היי! סליחה שאיחרתי, עשיתי גלגלונים לאורך קאראר מז'ור. שאלתי את כולם: הם הלכו לכיוון ברצלונה!"},{"who":"boss","en":"The Market King buys everything. Even this square. Even the way to Barcelona.","he":"מלך השוק קונה הכול. גם את הכיכר הזאת. גם את הדרך לברצלונה."},{"who":"omri","en":"Not for sale. I am in. Two on one, let's dance!","he":"לא למכירה. אני בפנים. שניים על אחד, בואו נרקוד!"}],"swapLines":null},{"key":"end","title":"After the boss","hero":"savta-orly","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...my coins... my beautiful coins...","he":"...המטבעות שלי... המטבעות היפים שלי..."},{"who":"savta-orly","en":"Bravo! Sit, eat something, you earned a xuixo. And Adi texted me a photo: the two of them in front of the Sagrada Família, waving.","he":"בראבו! שבו, תאכלו משהו, הרווחתם שוישו. ועדי שלחה לי תמונה: שניהם מול הסגרדה פמיליה, מנפנפים."},{"who":"savta-orly","en":"Fourth clue, and it is a good one. Barcelona, here we come.","he":"רמז רביעי, וטוב. ברצלונה, אנחנו באים."}],"swapLines":null}]},{"id":"barcelona","index":5,"name":["Barcelona","ברצלונה"],"boss":"prism-queen","waves":4,"scenes":[{"key":"start","title":"Opening","hero":"shmuel","join":false,"ifPlayed":"keep","lines":[{"who":"shmuel","en":"Carrer de Mallorca, and there she is: the Sagrada Família. Adi and Abir were here an hour ago. They are fine, they are just ahead of us.","he":"קארר דה מיורקה, והנה היא: הסגרדה פמיליה. עדי ואביר היו פה לפני שעה. הם בסדר, הם פשוט לפנינו."},{"who":"shmuel","en":"Halfway through. Quick reminder: it is a game. If it stops being fun, stop. Nobody minds.","he":"חצי דרך. תזכורת קטנה: זה משחק. אם זה מפסיק להיות כיף, מפסיקים. אף אחד לא כועס."},{"who":"shmuel","en":"If you are in: four waves this time. Pace yourselves, block with U when it gets crowded, grab the hearts.","he":"אם אתם בפנים: ארבעה גלים הפעם. תחלקו כוחות, חוסמים עם U כשנהיה צפוף, אוספים לבבות."}],"swapLines":null},{"key":"end","title":"After the boss","hero":"saba-kobi","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...my crystals... shattered... they had tickets... a basketball game...","he":"...הגבישים שלי... מנופצים... היו להם כרטיסים... משחק כדורסל..."},{"who":"saba-kobi","en":"The Prism Queen, in front of Gaudí's church! And two tickets in her crown: Eviatar's hall, tonight.","he":"מלכת הפריזמה, מול הכנסייה של גאודי! ושני כרטיסים בכתר שלה: האולם של אביתר, הערב."},{"who":"saba-kobi","en":"Fifth clue. Abir never misses a game. To the basketball hall!","he":"רמז חמישי. אביר לא מפספס משחק. לאולם הכדורסל!"}],"swapLines":null}]},{"id":"basketball-gym","index":6,"name":["Basketball gym","אולם הכדורסל"],"boss":"railmaw","waves":4,"scenes":[{"key":"start","title":"Opening","hero":"omri","join":false,"ifPlayed":"swap","lines":[{"who":"omri","en":"Eviatar's hall! Abir's scarf is on the bleachers, still warm from cheering. They were here, they are fine, they moved on.","he":"האולם של אביתר! הצעיף של אביר על הטריבונות, עוד חם מהעידוד. הם היו פה, הם בסדר, הם המשיכו."},{"who":"omri","en":"Then the Void Demons showed up under the hoop. That is a foul, right? They are the heavy ones. Get behind them and hit the back.","he":"ואז שדי החלל הופיעו מתחת לסל. זו עבירה, נכון? הם הכבדים. מאחוריהם ולהכות בגב."}],"swapLines":[{"who":"omri","en":"Eviatar's hall! Abir's scarf is on the bleachers, still warm from cheering. They were here, they are fine, they moved on.","he":"האולם של אביתר! הצעיף של אביר על הטריבונות, עוד חם מהעידוד. הם היו פה, הם בסדר, הם המשיכו."},{"who":"omri","en":"I have the mic this game, so {new} gets the ball. I sub back in next level.","he":"המיקרופון אצלי במשחק הזה, אז {new} מקבל את הכדור. אני חוזר לחמישייה בשלב הבא."},{"who":"omri","en":"Void Demons are the heavy ones. Do not stand in front of them. Get behind and hit the back.","he":"שדי החלל הם הכבדים. לא לעמוד מולם. מאחוריהם ולהכות בגב."}]},{"key":"boss","title":"Before the boss","hero":"omri","join":false,"ifPlayed":"keep","lines":[{"who":"omri","en":"Uh. The scoreboard just melted.","he":"אה. לוח התוצאות בדיוק נמס."},{"who":"boss","en":"From the deep I rise. The Abyss Dragon takes the court. Your parents left at half time. Wise.","he":"מהמעמקים אני עולה. דרקון התהום לוקח את המגרש. ההורים שלכם יצאו במחצית. חכמים."},{"who":"omri","en":"Then we take it back. Keep moving. He cannot hit what he cannot catch!","he":"אז אנחנו לוקחים אותו בחזרה. תמשיכו לזוז. הוא לא יכול להכות מה שהוא לא תופס!"}],"swapLines":null},{"key":"end","title":"After the boss","hero":"eviatar","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...back... to the deep...","he":"...חזרה... למעמקים..."},{"who":"eviatar","en":"That is my court. And that is Adi's handwriting on the scoreboard: \"Picking up your drawings at school. Love, Mom.\"","he":"זה המגרש שלי. וזה כתב היד של עדי על לוח התוצאות: \"אוספים את הציורים שלכם בבית הספר. אוהבת, אמא.\""},{"who":"eviatar","en":"Sixth clue. Hatikva School. Omri knows the way: through the yard, past the big tree.","he":"רמז שישי. בית הספר התקווה. עומרי מכיר את הדרך: דרך החצר, ליד העץ הגדול."}],"swapLines":null}]},{"id":"hatikva-school","index":7,"name":["Hatikva School","בית הספר התקווה"],"boss":"crown-runner","waves":4,"scenes":[{"key":"start","title":"Opening","hero":"omri","join":false,"ifPlayed":"keep","lines":[{"who":"omri","en":"Col·legi Hatikva! The court, the big tree, the blue mosaic wall. Adi took our drawings from the classroom, the teacher saw her. s":[{"key":"start","title":"Opening","hero":"saba-kobi","join":false,"ifPlayed":"swap","lines":[{"who":"saba-kobi","en":"Teatron HaMoshava! Red curtains, footlights. Adi and Abir were in the front row, the usher saw them clapping.","he":"תיאטרון המושבה! וילונות אדומים, אורות במה. עדי ואביר ישבו בשורה הראשונה, הסדרן ראה אותם מוחאים כפיים."},{"who":"saba-kobi","en":"Then the Void Demon came on. Places, everyone!","he":"ואז עלה שד החלל. כולם למקומות!"},{"who":"saba-kobi","en":"Mind the props table, and when the lights go magenta, that is a Sorceress winding up.","he":"תיזהרו משולחן האביזרים, וכשהאורות נהיים מג'נטה, זו מכשפה שמתכוננת."}],"swapLines":[{"who":"saba-kobi","en":"Teatron HaMoshava! Red curtains, footlights. Adi and Abir were in the front row, the usher saw them clapping.","he":"תיאטרון המושבה! וילונות אדומים, אורות במה. עדי ואביר ישבו בשורה הראשונה, הסדרן ראה אותם מוחאים כפיים."},{"who":"saba-kobi","en":"Then the Void Demon came on. Places, everyone!","he":"ואז עלה שד החלל. כולם למקומות!"},{"who":"saba-kobi","en":"Tonight I am the narrator, so {new} plays the lead. Do not worry, I am back on stage next level.","he":"הערב אני הקריין, אז {new} בתפקיד הראשי. אל דאגה, אני חוזר לבמה בשלב הבא."},{"who":"saba-kobi","en":"Mind the props table, and when the lights go magenta, that is a Sorceress winding up.","he":"תיזהרו משולחן האביזרים, וכשהאורות נהיים מג'נטה, זו מכשפה שמתכוננת."}]},{"key":"wave1","title":"After wave 1","hero":"omri","join":true,"ifPlayed":"keep","lines":[{"who":"omri","en":"Psst. I found a mic in the props, and a program with a note: \"Meet us at Savta's factory. Surprise!\" Mind if I join the show?","he":"פסט. מצאתי מיקרופון באביזרים, ותוכנייה עם פתק: \"תפגשו אותנו במפעל של סבתא. הפתעה!\" אכפת לכם אם אני מצטרף להצגה?"},{"who":"omri","en":"Act two. Let's give them a finale.","he":"מערכה שנייה. בואו ניתן להם פינאלה."}],"swapLines":null},{"key":"end","title":"After the boss","hero":"eviatar","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...the glass... goes dark...","he":"...הזכוכית... מחשיכה..."},{"who":"eviatar","en":"The Glass Warden, shattered, on opening night. Take a bow.","he":"שומר הזכוכית, מנופץ, בערב הבכורה. קידה."},{"who":"eviatar","en":"Last clue, last level. Savta Orly's candy factory. Adi and Abir are waiting there with a surprise. Let's go find them.","he":"רמז אחרון, שלב אחרון. מפעל הממתקים של סבתא אורלי. עדי ואביר מחכים שם עם הפתעה. בואו נמצא אותם."}],"swapLines":null}]},{"id":"candy-factory","index":10,"name":["Candy factory","מפעל הממתקים"],"boss":"ultra-signal","waves":5,"scenes":[{"key":"start","title":"Opening","hero":"savta-orly","join":false,"ifPlayed":"keep","lines":[{"who":"savta-orly","en":"Mamtakei Savta, my factory! The copper kettle, the taffy puller, the gumball tower. Adi and Abir are in the control room, safe, waving. See?","he":"ממתקי סבתא, המפעל שלי! קומקום הנחושת, מכונת הטופי, מגדל הגומי. עדי ואביר בחדר הבקרה, בטוחים, מנפנפים. רואים?"},{"who":"savta-orly","en":"Between us and them: five waves, the biggest yet. Everything you learned, all at once. I am right behind you with the pot.","he":"בינינו לבינם: חמישה גלים, הכי גדול עד עכשיו. כל מה שלמדתם, בבת אחת. אני ממש מאחוריכם עם הסיר."}],"swapLines":null},{"key":"wave1","title":"After wave 1","hero":"saba-kobi","join":true,"ifPlayed":"keep","lines":[{"who":"saba-kobi","en":"Room for one more? I closed the shesh-besh board. This is more important. Abir just gave me a thumbs up through the glass.","he":"יש מקום לעוד אחד? סגרתי את לוח השש-בש. זה יותר חשוב. אביר בדיוק עשה לי לייק דרך הזכוכית."},{"who":"saba-kobi","en":"Watch the conveyor belt. The wrapping machine is not on our side.","he":"תיזהרו מהמסוע. מכונת האריזה לא בצד שלנו."}],"swapLines":null},{"key":"end","title":"After the boss","hero":"shmuel","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...the flame... goes out...","he":"...הלהבה... כבה..."},{"who":"shmuel","en":"The Flame Samurai, in a candy factory. He picked the wrong family.","he":"סמוראי הלהבה, במפעל ממתקים. הוא בחר את המשפחה הלא נכונה."},{"who":"shmuel","en":"And there they are: Adi and Abir, out of the control room, with gumballs for everyone.","he":"והנה הם: עדי ואביר, יוצאים מחדר הבקרה, עם גומיות לכולם."},{"who":"pitz","en":"Purrrr.","he":"פררר."},{"who":"shmuel","en":"They were safe the whole way, just like I said. Rishon, Petah Tikva, Barcelona, all the way here. Every clue found.","he":"הם היו בטוחים כל הדרך, בדיוק כמו שאמרתי. ראשון, פתח תקווה, ברצלונה, כל הדרך עד לכאן. כל רמז נמצא."},{"who":"shmuel","en":"And that is the whole game. Nothing here was real, except the fun. Thank you for playing, and well done.","he":"וזה כל המשחק. שום דבר פה לא היה אמיתי, חוץ מהכיף. תודה ששיחקתם, וכל הכבוד."}],"swapLines":null}]}],"names":{"heroes":{"eviatar":{"en":"Eviatar","he":"אביתר"},"omri":{"en":"Omri","he":"עומרי"},"shmuel":{"en":"Shmuel","he":"שמואל"},"savta-orly":{"en":"Savta Orly","he":"סבתא אורלי"},"saba-kobi":{"en":"Saba Kobi","he":"סבא קובי"},"noa":{"en":"Noa","he":"נועה"}},"bosses":{"ferryman":"Ferryman","glass-warden":"Glass Warden","kilnheart":"Kilnheart","monk-zero":"Monk Zero","market-king":"Market King","railmaw":"Railmaw","crown-runner":"Crown Runner","the-null":"The Null","vault-mother":"Vault Mother","ultra-signal":"Ultra Signal","abyss-dragon":"Abyss Dragon","flame-samurai":"Flame Samurai","prism-queen":"Prism Queen","storm-colossus":"Storm Colossus"},"bossesHe":{"ferryman":"המעבורן","glass-warden":"שומר הזכוכית","kilnheart":"קילנהארט","monk-zero":"מונק זירו","market-king":"מלך השוק","railmaw":"ריילמו","crown-runner":"קראון ראנר","the-null":"האפס","vault-mother":"אם הכספת","ultra-signal":"אולטרה סיגנל","abyss-dragon":"דרקון התהום","flame-samurai":"סמוראי הלהבה","prism-queen":"מלכת הפריזמה","storm-colossus":"ענק הסערה"},"pitz":{"en":"Pitz","he":"פיץ"}}}</script>
<script>
(function(){
  var SRC = JSON.parse(document.getElementById('data').textContent);
  var KEY = 'eviomri.dialog-sheet.edits';
  var SPEAKERS = ['hero','boss','pitz','player'];
  var edits = {};
  try { edits = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { edits = {}; }
  var root = document.getElementById('root'), status = document.getElementById('status'), out = document.getElementById('out');
  function heroName(id, lang){ var n = SRC.names.heroes[id]; return n ? n[lang] : id; }
  function bossName(id, lang){ return lang === 'he' ? (SRC.names.bossesHe[id] || id) : (SRC.names.bosses[id] || id); }
  function whoLabel(who, scene, lang){ return who === 'boss' ? bossName(scene.__boss, lang) : who === 'pitz' ? SRC.names.pitz[lang] : who === 'player' ? (lang === 'he' ? 'השחקן' : 'the player') : heroName(who, lang); }
  function path(level, scene, list, i, field){ return [level.id, scene.key, list, i, field].join('/'); }
  function val(p, orig){ return p in edits ? edits[p] : orig; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(edits)); } catch (e) {} status.textContent = Object.keys(edits).length + ' edited field(s) kept on this device'; }
  function render(){
    root.innerHTML = '';
    SRC.data.forEach(function(level){
      var box = document.createElement('section'); box.className = 'level';
      box.innerHTML = '<h2>Level ' + level.index + ' · ' + level.name[0] + ' · ' + level.name[1] + '</h2><div class="meta">' + level.waves + ' waves · boss: ' + bossName(level.boss, 'en') + '</div>';
      level.scenes.forEach(function(scene){
        scene.__boss = level.boss;
        var det = document.createElement('details'); det.open = level.index === 1;
        var flags = heroName(scene.hero, 'en') + ' walks in' + (scene.join ? ' · stays to fight' : '') + (scene.ifPlayed === 'swap' ? ' · stand-in if played' : '');
        det.innerHTML = '<summary>' + scene.title + '<span class="flags">' + flags + '</span></summary>';
        renderLines(det, level, scene, 'lines', scene.lines);
        if (scene.swapLines) {
          var sw = document.createElement('div'); sw.className = 'swap';
          sw.innerHTML = '<div class="hint">When the player already picked ' + heroName(scene.hero, 'en') + ': {new} = the stand-in, {old} = ' + heroName(scene.hero, 'en') + '</div>';
          renderLines(sw, level, scene, 'swapLines', scene.swapLines);
          det.appendChild(sw);
        }
        box.appendChild(det);
      });
      root.appendChild(box);
    });
  }
  function renderLines(parent, level, scene, list, lines){
    lines.forEach(function(line, i){
      var who = val(path(level, scene, list, i, 'who'), line.who === scene.hero ? 'hero' : line.who);
      var div = document.createElement('div'); div.className = 'line ' + who;
      var whoRow = document.createElement('div'); whoRow.className = 'who';
      var sel = document.createElement('select');
      SPEAKERS.forEach(function(s){ var o = document.createElement('option'); o.value = s; o.textContent = s === 'hero' ? heroName(scene.hero, 'en') : s === 'boss' ? bossName(level.boss, 'en') : s === 'pitz' ? 'Pitz' : 'the player'; if (s === who) o.selected = true; sel.appendChild(o); });
      sel.addEventListener('change', function(){ var p = path(level, scene, list, i, 'who'); var orig = line.who === scene.hero ? 'hero' : line.who; if (sel.value === orig) delete edits[p]; else edits[p] = sel.value; div.className = 'line ' + sel.value; save(); });
      whoRow.appendChild(sel);
      var n = document.createElement('span'); n.textContent = 'page ' + (i + 1); whoRow.appendChild(n);
      div.appendChild(whoRow);
      ['en','he'].forEach(function(lang){
        var ta = document.createElement('textarea'); ta.className = lang; ta.value = val(path(level, scene, list, i, lang), line[lang]);
        if (lang === 'he') ta.dir = 'rtl';
        if (ta.value !== line[lang]) ta.classList.add('dirty');
        ta.addEventListener('input', function(){ var p = path(level, scene, list, i, lang); if (ta.value === line[lang]) { delete edits[p]; ta.classList.remove('dirty'); } else { edits[p] = ta.value; ta.classList.add('dirty'); } save(); });
        div.appendChild(ta);
      });
      parent.appendChild(div);
    });
  }
  function exportJson(){
    var levels = SRC.data.map(function(level){ return { id: level.id, scenes: level.scenes.map(function(scene){
      var conv = function(list, lines){ return lines.map(function(line, i){ var who = val(path(level, scene, list, i, 'who'), line.who === scene.hero ? 'hero' : line.who); return { who: who === 'hero' ? scene.hero : who, en: val(path(level, scene, list, i, 'en'), line.en), he: val(path(level, scene, list, i, 'he'), line.he) }; }); };
      return { key: scene.key, hero: scene.hero, join: scene.join, ifPlayed: scene.ifPlayed, lines: conv('lines', scene.lines), swapLines: scene.swapLines ? conv('swapLines', scene.swapLines) : null };
    }) }; });
    return JSON.stringify({ version: 1, exported: new Date().toISOString(), edits: Object.keys(edits).length, levels: levels }, null, 1);
  }
  document.getElementById('export').addEventListener('click', function(){ out.value = exportJson(); out.scrollIntoView({ block: 'nearest' }); status.textContent = 'Exported: copy, share, or select the text below.'; });
  document.getElementById('copy').addEventListener('click', function(){ var t = out.value || exportJson(); out.value = t; if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ status.textContent = 'Copied to the clipboard.'; }, function(){ out.focus(); out.select(); status.textContent = 'Select the text and copy it.'; }); else { out.focus(); out.select(); status.textContent = 'Select the text and copy it.'; } });
  document.getElementById('share').addEventListener('click', function(){ var t = out.value || exportJson(); out.value = t; if (navigator.share) { var f; try { f = new File([t], 'eviomri-dialogs.json', { type: 'application/json' }); } catch (e) {} var payload = f && navigator.canShare && navigator.canShare({ files: [f] }) ? { files: [f], title: 'EviOmri dialogs' } : { title: 'EviOmri dialogs', text: t }; navigator.share(payload).catch(function(){}); } else status.textContent = 'Sharing is not available here — use Copy.'; });
  document.getElementById('reset').addEventListener('click', function(){ if (!confirm('Throw away every edit on this device?')) return; edits = {}; save(); render(); });
  function setLang(mode){ document.body.className = mode === 'both' ? '' : 'lang-' + mode; try { localStorage.setItem(KEY + '.lang', mode); } catch (e) {} }
  document.getElementById('langEn').addEventListener('click', function(){ setLang('en'); });
  document.getElementById('langHe').addEventListener('click', function(){ setLang('he'); });
  document.getElementById('langBoth').addEventListener('click', function(){ setLang('both'); });
  try { setLang(localStorage.getItem(KEY + '.lang') || 'both'); } catch (e) {}
  render(); save();
})();
