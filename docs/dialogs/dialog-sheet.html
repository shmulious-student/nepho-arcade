<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EviOmri Dialog Sheet</title>
<style>
:root{--ground:#0b1730;--panel:#14243d;--line:#344861;--ink:#f3f4e8;--muted:#9bb1c9;--gold:#ffcf5c;--pink:#ff4f72;--cyan:#75f5dc}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;padding:0 16px 120px}
h1{font-size:22px;margin:24px 0 4px;color:var(--gold)}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.toolbar{position:sticky;top:0;z-index:5;background:rgba(11,23,48,.96);padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
button.primary{background:var(--gold);color:#10182b;border-color:var(--gold);font-weight:600}
.status{font-size:12px;color:var(--muted);flex-basis:100%}
.level{margin:22px 0 0;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:8px;background:var(--panel);padding:10px 12px 4px}
.level h2{font-size:18px;margin:2px 0 0}
.level .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
details{border-top:1px solid #25395a;padding:8px 0}
summary{cursor:pointer;font-weight:600;font-size:15px}
summary .flags{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.line{margin:10px 0 14px;padding-left:10px;border-left:3px solid var(--line)}
.line.hero{border-color:var(--cyan)}.line.boss{border-color:var(--pink)}.line.pitz{border-color:#35e8ff}.line.player{border-color:#a4ee42}
.who{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.who select{padding:2px 6px;font-size:12px}
textarea{width:100%;min-height:52px;font:inherit;font-size:15px;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:6px;resize:vertical}
textarea[dir=rtl]{text-align:right}
textarea.dirty{border-color:var(--gold)}
.hint{font-size:12px;color:var(--muted)}
.swap{margin-top:8px;padding:8px;border:1px dashed var(--line);border-radius:6px}
.swap .hint{margin-bottom:4px}
#out{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Menlo,monospace;margin-top:8px}
.lang-he .en,.lang-en .he{display:none}
</style>
</head>
<body>
<h1>EviOmri dialog sheet</h1>
<p class="sub">Every scene of every level: who walks in and what they say. Edit any line — edits stay on this phone until you export them. Bring the exported JSON back to the project and run <code>node tools/dialog-sheet.mjs --apply file.json</code>.</p>
<div class="toolbar">
  <button type="button" id="langEn">English</button>
  <button type="button" id="langHe">עברית</button>
  <button type="button" id="langBoth">Both</button>
  <button type="button" class="primary" id="export">Export edits</button>
  <button type="button" id="copy">Copy</button>
  <button type="button" id="share">Share</button>
  <button type="button" id="reset">Reset all</button>
  <span class="status" id="status"></span>
</div>
<div id="root"></div>
<textarea id="out" readonly placeholder="Export edits fills this with JSON you can copy, share or save."></textarea>
<script id="data" type="application/json">{"data":[{"id":"rishon","index":1,"name":["Rishon LeZion","ראשון לציון"],"boss":"ferryman","waves":3,"scenes":[{"key":"start","title":"Opening","hero":"shmuel","join":false,"ifPlayed":"keep","lines":[{"who":"shmuel","en":"Hi! I am Shmuel, and before anything else: this is a game. Nothing here is real. Not the story, not the punches.","he":"היי! אני שמואל, ולפני הכול: זה משחק. שום דבר פה לא אמיתי. לא העלילה ולא המכות."},{"who":"shmuel","en":"You do not have to like it, and you do not have to play it. Stop whenever you want. Nothing bad happens.","he":"לא חייבים לאהוב אותו, ולא חייבים לשחק בו. אפשר להפסיק מתי שרוצים. שום דבר רע לא קורה."},{"who":"shmuel","en":"So there is some action, the story goes like this: Eviatar and Omri, that is you, are looking for Dad Abir and Mom Adi all over the world.","he":"כדי שיהיה קצת אקשן, העלילה של המשחק תהיה כזאת: אביתר ועומרי, אתם, מחפשים את אבא אביר ואמא עדי ברחבי העולם."},{"who":"shmuel","en":"Do not worry, they are totally fine. They are just somewhere along the way, and we will find them, one clue at a time.","he":"אל תדאגו, הם בסדר גמור. הם פשוט איפשהו לאורך הדרך, ואנחנו נמצא אותם, רמז אחרי רמז."},{"who":"shmuel","en":"This is HaSarig Street in Rishon LeZion, Saba and Savta's house. The bad guys are holding them.","he":"זה רחוב השריג בראשון לציון, הבית של סבא וסבתא. הרעים מחזיקים אותם."},{"who":"shmuel","en":"Beat the bad guys to free them, and they will come along with you to the next clue. Good luck!","he":"נצחו את הרעים כדי לשחרר אותם, והם ימשיכו איתכם לרמז הבא. בהצלחה!"},{"who":"pitz","en":"Mrrp! (Pitz is coming too. Obviously.)","he":"מררפ! (פיץ בא גם. ברור.)"},{"who":"player","en":"We are on it, bro!","he":"אנחנו על זה bro!"}],"swapLines":null},{"key":"boss","title":"Before the boss","hero":"shmuel","join":true,"ifPlayed":"keep","lines":[{"who":"shmuel","en":"Hold on. The ground is shaking. That is not a punk, that is the first boss. Remember: just a game.","he":"רגע. הרצפה רועדת. זה לא פאנק, זה הבוס הראשון. תזכרו: רק משחק."},{"who":"boss","en":"Looking for Saba and Savta? For Mom and Dad? The Ferryman knows every road. Pay the toll and maybe I will tell you.","he":"מחפשים את סבא וסבתא? את אמא ואבא? המעבורן מכיר כל דרך. שלמו את האגרה ואולי אספר."},{"who":"shmuel","en":"Nobody pays on our street. I am staying for this one. Let's go!","he":"אצלנו ברחוב לא משלמים. אני נשאר לקרב הזה. קדימה!"}],"swapLines":null},{"key":"end","title":"After the boss","hero":"noa","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"Fine... Refael Eitan Street... that is the only clue I have...","he":"טוב... רחוב רפאל איתן... זה הרמז היחיד שיש לי..."},{"who":"pitz","en":"Meow. Meow-meow.","he":"מיאו. מיאו-מיאו."},{"who":"noa","en":"Pitz says the Ferryman dropped a note. A supermarket receipt with Adi's name, and a smiley on it. She is fine.","he":"פיץ אומר שהמעבורן הפיל פתק. קבלה מהסופר עם השם של עדי, וסמיילי עליה. היא בסדר."},{"who":"noa","en":"And Saba and Savta are free! First clue: Refael Eitan Street. Saba Kobi is already on his way there with the newspaper.","he":"וסבא וסבתא חופשיים! רמז ראשון: רחוב רפאל איתן. סבא קובי כבר בדרך לשם עם העיתון."}],"swapLines":null}]},{"id":"petah-tikva","index":2,"name":["Refael Eitan Street","רחוב רפאל איתן"],"boss":"monk-zero","waves":3,"scenes":[{"key":"start","title":"Opening","hero":"saba-kobi","join":false,"ifPlayed":"keep","lines":[{"who":"saba-kobi","en":"Refael Eitan Street! Thanks for the rescue, kids. Adi was here at the supermarket this morning, she just went on ahead.","he":"רחוב רפאל איתן! תודה על החילוץ, ילדים. עדי הייתה פה בסופר הבוקר, היא פשוט המשיכה הלאה."},{"who":"pitz","en":"Mrrp. Bag of milk, two bourekas. Mom-smell. Fresh.","he":"מררפ. שקית חלב, שני בורקסים. ריח של אמא. טרי."},{"who":"saba-kobi","en":"And Abir? Abir called from somewhere with drums. We will get to that. First these punks, and a Gold Sorceress who throws things.","he":"ואביר? אביר התקשר ממקום עם תופים. נגיע לזה. קודם הפאנקים האלה, ומכשפת זהב שזורקת דברים."},{"who":"saba-kobi","en":"Dash out of her way: hold the run button and push sideways 😉","he":"תתחמקו ממנה בריצה: מחזיקים את כפתור הריצה ודוחפים הצידה 😉"}],"swapLines":null},{"key":"boss","title":"Before the boss","hero":"savta-orly","join":false,"ifPlayed":"keep","lines":[{"who":"savta-orly","en":"Wait, wait, I brought soup. Nobody fights a boss on an empty stomach.","he":"רגע, רגע, הבאתי מרק. אף אחד לא נלחם בבוס על בטן ריקה."},{"who":"savta-orly","en":"And news: Adi left me a message. She is fine, she is with Abir.","he":"וחדשות: עדי השאירה לי הודעה. היא בסדר, היא עם אביר."},{"who":"boss","en":"Monk Zero needs no soup. Only silence. Your parents passed my street. Them I let through. You, I will not.","he":"מונק זירו לא צריכה מרק. רק שקט. ההורים שלכם עברו ברחוב שלי. להם נתתי לעבור. לכם לא."},{"who":"savta-orly","en":"Silence? In this family? Good luck with that. Watch out for this Monk Zero, sweethearts!","he":"שקט? במשפחה הזאת? בהצלחה עם זה. תיזהרו מהמונק זירו הזאת, מתוקים!"}],"swapLines":null},{"key":"end","title":"After the boss","hero":"noa","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...so loud... the gym... they went to the gym with the drums...","he":"...כל כך רועש... המכון... הם הלכו למכון עם התופים..."},{"who":"noa","en":"Drums! That is Omri's capoeira gym. And Abir forgot his gym bag there, I am sure of it!","he":"תופים! זה מכון הקפוארה של עומרי. ואביר שכח שם את תיק הספורט שלו, אני בטוחה!"},{"who":"noa","en":"Second clue. Off to Academia Ginga. Eviatar is already there, and he wants to show you something.","he":"רמז שני. יוצאים לאקדמיה ז'ינגה. אביתר כבר שם, והוא רוצה להראות לכם משהו."}],"swapLines":null}]},{"id":"capoeira-gym","index":3,"name":["Capoeira gym","מכון הקפוארה"],"boss":"kilnheart","waves":4,"scenes":[{"key":"start","title":"Opening","hero":"eviatar","join":false,"ifPlayed":"swap","lines":[{"who":"eviatar","en":"Omri's gym, Academia Ginga. Look: Dad's bag on the bench, and a note. \"Went to buy pastries with Mom. Back soon. Love you.\"","he":"המכון של עומרי, אקדמיה ז'ינגה. תראו: התיק של אבא על הספסל, ופתק. \"הלכנו לקנות מאפים עם אמא. חוזרים. אוהבים.\""},{"who":"eviatar","en":"See? They are totally fine. We just keep following. Bio-Brutes are slow but hit like a truck: jump, then attack in the air, and they go down.","he":"רואים? הכול טוב איתם. פשוט ממשיכים לעקוב. ביו-ברוטים איטיים אבל מכים כמו משאית: קופצים ומכים באוויר, והם נופלים."},{"who":"eviatar","en":"But... where is Omri?","he":"אבל... איפה עומרי?"}],"swapLines":[{"who":"eviatar","en":"Omri's gym, Academia Ginga. Look: Dad's bag on the bench, and a note. \"Went to buy pastries with Mom. Back soon. Love you.\"","he":"המכון של עומרי, אקדמיה ז'ינגה. תראו: התיק של אבא על הספסל, ופתק. \"הלכנו לקנות מאפים עם אמא. חוזרים. אוהבים.\""},{"who":"eviatar","en":"I am reading the clues on this level, so {new} steps in for me. Next level I am back with you.","he":"אני קורא את הרמזים בשלב הזה, אז {new} נכנס במקומי. בשלב הבא אני חוזר אליכם."},{"who":"eviatar","en":"Bio-Brutes are slow but hit like a truck: jump, then attack in the air, and they go down. But... where is Omri?","he":"ביו-ברוטים איטיים אבל מכים כמו משאית: קופצים ומכים באוויר, והם נופלים. אבל... איפה עומרי?"}]},{"key":"boss","title":"Before the boss","hero":"eviatar","join":false,"ifPlayed":"keep","lines":[{"who":"eviatar","en":"Feel that heat? Something is coming through the back wall.","he":"מרגישים את החום? משהו עובר דרך הקיר האחורי."},{"who":"pitz","en":"HSSSS. (Pitz does not like ovens.)","he":"הסססס. (פיץ לא אוהב תנורים.)"},{"who":"boss","en":"Kilnheart. I turn gyms into ovens. Your parents bought their pastries and left. Lucky them.","he":"קילנהארט. אני הופך מכונים לתנורים. ההורים שלכם קנו מאפים והלכו. מזל שלהם."},{"who":"eviatar","en":"Pastries. Got it. When he charges, jump. When the floor glows, move.","he":"מאפים. הבנתי. כשהוא מסתער, קופצים. כשהרצפה זוהרת, זזים."}],"swapLines":null},{"key":"end","title":"After the boss","hero":"omri","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...cooling... down...","he":"...מתקרר..."},{"who":"omri","en":"MY GYM! You saved my gym! And here I am, sorry, I was upside down the whole time. Look what fell out of his pocket: a receipt from Sant Cugat.","he":"המכון שלי! הצלתם את המכון שלי! והנה אני, סליחה, הייתי הפוך כל הזמן. תראו מה נפל לו מהכיס: קבלה מסנט קוגט."},{"who":"omri","en":"Third clue! Sant Cugat. The big square, the monastery, and the shops! I bet that is where they went!","he":"רמז שלישי! סנט קוגט. הכיכר הגדולה, המנזר, והחנויות! בטוח שלשם הם הלכו!"}],"swapLines":null}]},{"id":"sant-cugat","index":4,"name":["Sant Cugat","סנט קוגט"],"boss":"market-king","waves":3,"scenes":[{"key":"start","title":"Opening","hero":"eviatar","join":false,"ifPlayed":"keep","lines":[{"who":"pitz","en":"Mrrp. Plaça d'Octavià. Two chairs by the café, still warm.","he":"מררפ. פלאסה ד'אוקטביה. שני כיסאות ליד הקפה, עוד חמים."},{"who":"pitz","en":"Mom-smell, Dad-smell, two coffees, one hour ago. They laughed. They are fine.","he":"ריח של אמא, ריח של אבא, שני קפה, לפני שעה. הם צחקו. הם בסדר."},{"who":"eviatar","en":"Pitz, you are the best detective in Catalunya.","he":"פיץ, אתה הבלש הכי טוב בקטלוניה."},{"who":"eviatar","en":"Then Rainbow Oracles filled the square. They dodge a lot. Do not chase, let them come to you, then the third hit.","he":"ואז אורקלי קשת מילאו את הכיכר. הם מתחמקים המון. לא לרדוף, שיבואו אליכם, ואז המכה השלישית."},{"who":"pitz","en":"Mrrow. (Translation: obviously.)","he":"מררוו. (תרגום: ברור.)"}],"swapLines":null},{"key":"boss","title":"Before the boss","hero":"omri","join":true,"ifPlayed":"keep","lines":[{"who":"omri","en":"Hey! Sorry I am late, I was doing cartwheels down Carrer Major. I asked everyone: they went towards Barcelona!","he":"היי! סליחה שאיחרתי, עשיתי גלגלונים לאורך קאראר מז'ור. שאלתי את כולם: הם הלכו לכיוון ברצלונה!"},{"who":"boss","en":"The Market King buys everything. Even this square. Even the way to Barcelona.","he":"מלך השוק קונה הכול. גם את הכיכר הזאת. גם את הדרך לברצלונה."},{"who":"omri","en":"Not for sale. I am in. Two on one, let's dance!","he":"לא למכירה. אני בפנים. שניים על אחד, בואו נרקוד!"}],"swapLines":null},{"key":"end","title":"After the boss","hero":"savta-orly","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...my coins... my beautiful coins...","he":"...המטבעות שלי... המטבעות היפים שלי..."},{"who":"savta-orly","en":"Bravo! Sit, eat something, you earned a xuixo. And Adi texted me a photo: the two of them in front of the Sagrada Família, waving.","he":"בראבו! שבו, תאכלו משהו, הרווחתם שוישו. ועדי שלחה לי תמונה: שניהם מול הסגרדה פמיליה, מנפנפים."},{"who":"savta-orly","en":"Fourth clue, and a good one. Barcelona, here we come.","he":"רמז רביעי, וטוב. ברצלונה, אנחנו באים."}],"swapLines":null}]},{"id":"barcelona","index":5,"name":["Barcelona","ברצלונה"],"boss":"prism-queen","waves":4,"scenes":[{"key":"start","title":"Opening","hero":"shmuel","join":false,"ifPlayed":"keep","lines":[{"who":"shmuel","en":"Carrer de Mallorca, and there she is: the Sagrada Família. Adi and Abir were here an hour ago. They are fine, they are just ahead of us.","he":"קארר דה מיורקה, והנה היא: הסגרדה פמיליה. עדי ואביר היו פה לפני שעה. הם בסדר, הם פשוט לפנינו."},{"who":"pitz","en":"Mrrp. A padel ball under the bench. Dad-smell.","he":"מררפ. כדור פאדל מתחת לספסל. ריח של אבא."},{"who":"shmuel","en":"Halfway through. Quick reminder: it is a game. If it stops being fun, stop. Nobody minds.","he":"חצי דרך. תזכורת קטנה: זה משחק. אם זה מפסיק להיות כיף, מפסיקים. אף אחד לא כועס."},{"who":"shmuel","en":"If you are in: four waves this time. Pace yourselves, you can also block hits when it gets crowded, and grab the hearts.","he":"אם אתם בפנים: ארבעה גלים הפעם. תחלקו כוחות, אפשר גם לחסום מכות כשנהיה צפוף, ואוספים לבבות."}],"swapLines":null},{"key":"end","title":"After the boss","hero":"saba-kobi","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...my crystals... shattered... they had tickets... the sports hall...","he":"...הגבישים שלי... מנופצים... היו להם כרטיסים... אולם הספורט..."},{"who":"saba-kobi","en":"The Prism Queen, in front of Gaudí's church! And two tickets in her crown: Eviatar's hall, tonight.","he":"מלכת הפריזמה, מול הכנסייה של גאודי! ושני כרטיסים בכתר שלה: האולם של אביתר, הערב."},{"who":"saba-kobi","en":"Fifth clue. Abir has probably started a padel tournament there already. To the basketball hall!","he":"רמז חמישי. אביר בטח כבר התחיל שם טורניר פאדל. לאולם הכדורסל!"}],"swapLines":null}]},{"id":"basketball-gym","index":6,"name":["Basketball gym","אולם הכדורסל"],"boss":"railmaw","waves":4,"scenes":[{"key":"start","title":"Opening","hero":"omri","join":false,"ifPlayed":"swap","lines":[{"who":"omri","en":"Eviatar's hall! Dad's scarf is on the bleachers, still warm from cheering. They were here, they are fine, they moved on.","he":"האולם של אביתר! הצעיף של אבא על הטריבונות, עוד חם מהעידוד. הם היו פה, הם בסדר, הם המשיכו."},{"who":"omri","en":"Then the Void Demons showed up under the hoop. That is a foul, right? They are the slow ones. Sneak behind them and hit the back.","he":"ואז שדי החלל הופיעו מתחת לסל. זו עבירה, נכון? הם האיטיים יותר. להתגנב מאחוריהם ולהכות בגב."}],"swapLines":[{"who":"omri","en":"Eviatar's hall! Dad's scarf is on the bleachers, still warm from cheering. They were here, they are fine, they moved on.","he":"האולם של אביתר! הצעיף של אבא על הטריבונות, עוד חם מהעידוד. הם היו פה, הם בסדר, הם המשיכו."},{"who":"omri","en":"I have the mic this game, so {new} gets the ball. I sub back in next level.","he":"המיקרופון אצלי במשחק הזה, אז {new} מקבל את הכדור. אני חוזר לחמישייה בשלב הבא."},{"who":"omri","en":"Void Demons are the slow ones. Do not stand in front of them. Sneak behind and hit the back.","he":"שדי החלל הם האיטיים. לא לעמוד מולם. להתגנב מאחוריהם ולהכות בגב."}]},{"key":"boss","title":"Before the boss","hero":"omri","join":false,"ifPlayed":"keep","lines":[{"who":"omri","en":"Uh. The scoreboard just melted.","he":"אה. לוח התוצאות בדיוק נמס."},{"who":"boss","en":"From the deep I rise. The Abyss Dragon takes the court. Your parents left at half time. Wise.","he":"מהמעמקים אני עולה. דרקון התהום לוקח את המגרש. ההורים שלכם יצאו במחצית. חכמים."},{"who":"omri","en":"Then we take it back. Keep moving, he cannot hit what he cannot catch! But... where is Eviatar?","he":"אז אנחנו לוקחים אותו בחזרה. תמשיכו לזוז, הוא לא יכול להכות מה שהוא לא תופס! אבל... איפה אביתר?"}],"swapLines":null},{"key":"end","title":"After the boss","hero":"eviatar","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...back... to the deep...","he":"...חזרה... למעמקים..."},{"who":"eviatar","en":"Here! I was on the roof fixing the scoreboard. That is my court, nobody dunks on it but me.","he":"פה! הייתי על הגג מתקן את לוח התוצאות. זה המגרש שלי, אף אחד לא עושה בו דאנק חוץ ממני."},{"who":"eviatar","en":"And that is Mom's handwriting on the scoreboard: \"Picking up your drawings at school. Love, Mom.\"","he":"וזה כתב היד של אמא על לוח התוצאות: \"אוספים את הציורים שלכם בבית הספר. אוהבת, אמא.\""},{"who":"pitz","en":"Purr. (Pitz found the marker she wrote it with.)","he":"פררר. (פיץ מצא את הטוש שהיא כתבה איתו.)"},{"who":"eviatar","en":"Sixth clue. Hatikva School. Omri knows the way: through the yard, past the big tree.","he":"רמז שישי. בית הספר התקווה. עומרי מכיר את הדרך: דרך החצר, ליד העץ הגדול."}],"swapLines":null}]},{"id":"hatikva-school","index":7,"name":["Hatikva School","בית הספר התקווה"],"boss":"crown-runner","waves":4,"scenes":[{"key":"start","title":"Opening","hero":"omri","join":false,"ifPlayed":"keep","lines":[{"who":"omri","en":"Hatikva School! The court, the big tree, the blue mosaic wall. Mom took our drawings from the classroom, the teacher saw her.","he":"בית ספר התקווה! המגרש, העץ הגדול, קיר הפסיפס הכחול. אמא לקחה את הציורים שלנו מהכיתה, המורה ראתה אותה."},{"who":"omri","en":"Four waves this time, then something big. When the meter is full, press the special and it clears the whole yard.","he":"הפעם יש ארבעה גלים, ואז משהו גדול. כשהמד מלא לוחצים על הספיישל והוא מנקה את כל החצר."}],"swapLines":null},{"key":"wave2","title":"After wave 2","hero":"eviatar","join":true,"ifPlayed":"keep","lines":[{"who":"eviatar","en":"Two waves down. Recess is over. I found Dad's coffee cup by the olive tree, so they are close.","he":"שני גלים ירדו. ההפסקה נגמרה. מצאתי את כוס הקפה של אבא ליד עץ הזית, אז הם בסביבה."},{"who":"eviatar","en":"I am joining you for the rest of this one.","he":"אני מצטרף אליכם לשאר השלב."},{"who":"pitz","en":"Mrrp. Still warm. (Pitz checked. With his nose.)","he":"מררפ. עוד חמה. (פיץ בדק. עם האף.)"},{"who":"eviatar","en":"Stick together. The Bio-Brutes come from both sides now.","he":"תישארו ביחד. הביו-ברוטים מגיעים עכשיו משני הצדדים."}],"swapLines":null},{"key":"end","title":"After the boss","hero":"saba-kobi","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...the deep... calls me home... they went up... the hill...","he":"...המעמקים... קוראים לי הביתה... הם עלו... לגבעה..."},{"who":"saba-kobi","en":"The dragon came back for a second round and left with a second bruise. Ha! And a clue: the hill above Barcelona.","he":"הדרקון חזר לסיבוב שני ויצא עם חבורה שנייה. חה! ורמז: הגבעה מעל ברצלונה."},{"who":"saba-kobi","en":"Seventh clue. Noa is waiting at the bunkers. Bring a little jacket, it is windy.","he":"רמז שביעי. נועה מחכה בבונקרים. תביאו ז'קטיקו, יש רוח."}],"swapLines":null}]},{"id":"catalunya","index":8,"name":["Catalunya","קטלוניה"],"boss":"the-null","waves":3,"scenes":[{"key":"start","title":"Opening","hero":"noa","join":false,"ifPlayed":"keep","lines":[{"who":"noa","en":"Bunkers del Carmel. The whole city, the sea, Montserrat on the horizon. And Adi's picnic blanket, folded, with two cups. They were just here.","he":"בונקרס דל כרמל. כל העיר, הים, מונסראט באופק. והשמיכה של עדי, מקופלת, עם שתי כוסות. הם היו פה ממש עכשיו."},{"who":"noa","en":"It is windy up here. Watch the edge, and watch the Sorceress's bolts. Dash through them.","he":"יש פה רוח. תיזהרו מהקצה, ומהברקים של המכשפה. רצים דרכם."}],"swapLines":null},{"key":"wave2","title":"After wave 2","hero":"noa","join":false,"ifPlayed":"keep","lines":[{"who":"noa","en":"Nice. See down there? The Sagrada Família, the gym, the school. You have followed them across the whole map.","he":"יפה. רואים שם למטה? הסגרדה פמיליה, המכון, בית הספר. עקבתם אחריהם על פני כל המפה."},{"who":"pitz","en":"Mrrrp. Meow!","he":"מררפ. מיאו!"},{"who":"noa","en":"Pitz smells someone familiar at the top of the hill. And someone not familiar at all. One more wave first.","he":"פיץ מריח מישהו מוכר בראש הגבעה. ומישהו בכלל לא מוכר. קודם עוד גל אחד."}],"swapLines":null},{"key":"boss","title":"Before the boss","hero":"noa","join":true,"ifPlayed":"keep","lines":[{"who":"noa","en":"There it is. The not-familiar one.","he":"הנה זה. הלא-מוכר."},{"who":"boss","en":"I am back, and stronger. Petah Tikva was practice. Your parents are at the theatre. I am here.","he":"אני חוזרת, וחזקה יותר. פתח תקווה הייתה אימון. ההורים שלכם בתיאטרון. אני כאן."},{"who":"noa","en":"So was that. I am bringing the rolling pin. Let's finish her together, then the theatre.","he":"גם זה היה אימון. אני מביאה את המערוך. בואו נסיים אותה ביחד, ואז התיאטרון."}],"swapLines":null},{"key":"end","title":"After the boss","hero":"noa","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...zero...","he":"...אפס..."},{"who":"noa","en":"Twice. She lost to this family twice. And she was telling the truth: two theatre tickets, front row, in Abir's handwriting.","he":"פעמיים. היא הפסידה למשפחה הזאת פעמיים. והיא אמרה את האמת: שני כרטיסים לתיאטרון, שורה ראשונה, בכתב היד של אביר."},{"who":"noa","en":"Eighth clue. The Liceu, in Barcelona. Saba Kobi got us seats too. On the stage.","he":"רמז שמיני. הליסאו, בברצלונה. סבא קובי השיג גם לנו מקומות. על הבמה."}],"swapLines":null}]},{"id":"theater","index":9,"name":["Theater","התיאטרון"],"boss":"vault-mother","waves":3,"scenes":[{"key":"start","title":"Opening","hero":"saba-kobi","join":false,"ifPlayed":"swap","lines":[{"who":"saba-kobi","en":"The Liceu theatre! Red curtains, footlights. Adi and Abir were in the front row, the usher saw them clapping.","he":"תיאטרון ליסאו! וילונות אדומים, אורות במה. עדי ואביר ישבו בשורה הראשונה, הסדרן ראה אותם מוחאים כפיים."},{"who":"saba-kobi","en":"Then the Void Demon came on. Places, everyone!","he":"ואז עלה שד החלל. כולם למקומות!"},{"who":"saba-kobi","en":"Mind the props table, and when the lights go purple, that is a Sorceress winding up.","he":"תיזהרו משולחן האביזרים, וכשהאורות נהיים סגולים, זו מכשפה שמתכוננת."}],"swapLines":[{"who":"saba-kobi","en":"The Liceu theatre! Red curtains, footlights. Adi and Abir were in the front row, the usher saw them clapping.","he":"תיאטרון ליסאו! וילונות אדומים, אורות במה. עדי ואביר ישבו בשורה הראשונה, הסדרן ראה אותם מוחאים כפיים."},{"who":"saba-kobi","en":"Then the Void Demon came on. Places, everyone!","he":"ואז עלה שד החלל. כולם למקומות!"},{"who":"saba-kobi","en":"Tonight I am the narrator, so {new} plays the lead. Do not worry, I am back on stage next level.","he":"הערב אני הקריין, אז {new} בתפקיד הראשי. אל דאגה, אני חוזר לבמה בשלב הבא."},{"who":"saba-kobi","en":"Mind the props table, and when the lights go purple, that is a Sorceress winding up.","he":"תיזהרו משולחן האביזרים, וכשהאורות נהיים סגולים, זו מכשפה שמתכוננת."}]},{"key":"wave1","title":"After wave 1","hero":"omri","join":true,"ifPlayed":"keep","lines":[{"who":"omri","en":"Psst. I found a mic in the props, and a program with a note: \"Meet us at Savta's factory. Surprise!\" Mind if I join the show?","he":"פסט. מצאתי מיקרופון באביזרים, ותוכנייה עם פתק: \"תפגשו אותנו במפעל של סבתא. הפתעה!\" אכפת לכם אם אני מצטרף להצגה?"},{"who":"pitz","en":"Mrrp. (Pitz is in the orchestra pit. He is the drums.)","he":"מררפ. (פיץ בבור התזמורת. הוא התופים.)"},{"who":"omri","en":"Act two. Let's give them a finale.","he":"מערכה שנייה. בואו ניתן להם פינאלה."}],"swapLines":null},{"key":"end","title":"After the boss","hero":"eviatar","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...the glass... goes dark...","he":"...הזכוכית... מחשיכה..."},{"who":"eviatar","en":"The Glass Warden, shattered, on opening night. That was worth a bow.","he":"שומר הזכוכית, מנופץ, בערב הבכורה. ממש שווה שנקוד לו קידה."},{"who":"eviatar","en":"Last clue: Savta Orly's candy factory. Mom and Dad are waiting there with a surprise. Let's go find them!","he":"הרמז האחרון: מפעל הממתקים של סבתא אורלי. אמא ואבא מחכים שם עם הפתעה. בואו נמצא אותם!"}],"swapLines":null}]},{"id":"candy-factory","index":10,"name":["Candy factory","מפעל הממתקים"],"boss":"ultra-signal","waves":5,"scenes":[{"key":"start","title":"Opening","hero":"savta-orly","join":false,"ifPlayed":"keep","lines":[{"who":"savta-orly","en":"Mamtakei Savta, my factory! The copper kettle, the taffy puller, the gumball tower.","he":"ממתקי סבתא, המפעל שלי! קומקום הנחושת, מכונת הטופי, מגדל הגומי."},{"who":"savta-orly","en":"And Adi and Abir in the control room, safe, waving. See?","he":"ועדי ואביר בחדר הבקרה, בטוחים, מנפנפים. רואים?"},{"who":"pitz","en":"MEOW! MEOW! (Pitz saw them first. He wants it noted.)","he":"מיאו! מיאו! (פיץ ראה אותם ראשון. שיירשם.)"},{"who":"savta-orly","en":"Between us and them: five waves, the biggest yet. Everything you learned, all at once. I am right behind you with the pot.","he":"בינינו לבינם: חמישה גלים, הכי גדול עד עכשיו. כל מה שלמדתם, בבת אחת. אני ממש מאחוריכם עם הסיר."}],"swapLines":null},{"key":"wave1","title":"After wave 1","hero":"saba-kobi","join":true,"ifPlayed":"keep","lines":[{"who":"saba-kobi","en":"Room for one more? I closed the shesh-besh board. This is more important. Abir just gave me a thumbs up through the glass.","he":"יש מקום לעוד אחד? סגרתי את לוח השש-בש. זה יותר חשוב. אביר בדיוק עשה לי לייק דרך הזכוכית."},{"who":"saba-kobi","en":"Watch the conveyor belt. The wrapping machine is not on our side.","he":"תיזהרו מהמסוע. מכונת האריזה לא בצד שלנו."}],"swapLines":null},{"key":"end","title":"After the boss","hero":"shmuel","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"...the flame... goes out...","he":"...הלהבה... כבה..."},{"who":"shmuel","en":"The Flame Samurai, in a candy factory. He picked the wrong family. And the control room door is opening!","he":"סמוראי הלהבה, במפעל ממתקים. הוא בחר את המשפחה הלא נכונה. ודלת חדר הבקרה נפתחת!"},{"who":"shmuel","en":"Rishon, Petah Tikva, Barcelona, Sant Cugat... all the way here. Every clue found. I am proud of you.","he":"ראשון, פתח תקווה, ברצלונה, סאנט קוגאט... כל הדרך עד לכאן. כל רמז נמצא. אני גאה בכם."},{"who":"pitz","en":"HSSS! (Pitz is staring at the back door.)","he":"הססס! (פיץ בוהה בדלת האחורית.)"},{"who":"shmuel","en":"Wait. Adi says the presents are gone. All of them. And there are little brown footprints leading out the back door...","he":"רגע. עדי אומרת שהמתנות נעלמו. כולן. ויש עקבות חומות קטנות שמובילות מהדלת האחורית..."},{"who":"shmuel","en":"One more level, then. The footprints go up into the hills. Pitz, lead the way.","he":"אז עוד שלב אחד. העקבות עולות להרים. פיץ, תוביל."}],"swapLines":null}]},{"id":"tio-lair","index":11,"name":["tio-lair","tio-lair"],"boss":"caga-tio","waves":4,"scenes":[{"key":"start","title":"Opening","hero":"omri","join":false,"ifPlayed":"keep","lines":[{"who":"pitz","en":"Mrrp. Footprints end here. Log-smell. Turrón-smell. Presents. Lots.","he":"מררפ. העקבות נגמרות פה. ריח של בול עץ. ריח של טורון. מתנות. הרבה."},{"who":"omri","en":"Caga Tió! The Christmas log from Catalunya. He took every present from Savta's factory and he is grinning about it.","he":"קאגה טיו! בול העץ של חג המולד מקטלוניה. הוא לקח כל מתנה מהמפעל של סבתא והוא מחייך על זה."},{"who":"omri","en":"You know how it works here: you hit the Tió and he... gives the presents back. From behind. Watch where you stand 😉","he":"אתם יודעים איך זה עובד פה: מרביצים לטיו והוא... מחזיר את המתנות. מאחור. תיזהרו איפה אתם עומדים 😉"},{"who":"omri","en":"And he brought friends: every boss we beat is back, one after the other, before we reach the log.","he":"והוא הביא חברים: כל בוס שניצחנו חוזר, אחד אחרי השני, לפני שנגיע לבול העץ."},{"who":"omri","en":"Last level, everyone is here. Let's go!","he":"שלב אחרון, כולם פה. קדימה!"}],"swapLines":null},{"key":"wave2","title":"After wave 2","hero":"savta-orly","join":true,"ifPlayed":"keep","lines":[{"who":"savta-orly","en":"Nobody takes presents from my factory. I brought the big pot. Move over, sweethearts, Savta is joining.","he":"אף אחד לא לוקח מתנות מהמפעל שלי. הבאתי את הסיר הגדול. זוזו, מתוקים, סבתא מצטרפת."},{"who":"savta-orly","en":"Two waves left. Then we knock the turrón out of that log.","he":"נשארו שני גלים. ואז אנחנו מוציאים את הטורון מבול העץ הזה."}],"swapLines":null},{"key":"boss","title":"Before the boss","hero":"eviatar","join":true,"ifPlayed":"keep","lines":[{"who":"eviatar","en":"There he is. The log. He is bigger than in the pictures.","he":"הנה הוא. בול העץ. הוא יותר גדול מאשר בתמונות."},{"who":"boss","en":"Caga tió, caga torró! You want them? Come and knock them out of me!","he":"קאגה טיו, קאגה טורו! רוצים אותן? בואו תוציאו אותן ממני!"},{"who":"pitz","en":"HSSSSS. (That is the loudest Pitz has ever been.)","he":"הסססססס. (זה הכי חזק שפיץ אי פעם נשמע.)"},{"who":"eviatar","en":"Mom and Dad are right behind him. Everyone in: Omri, Pitz, Saba, Savta, Noa, me. Let's finish this!","he":"אמא ואבא ממש מאחוריו. כולם בפנים: עומרי, פיץ, סבא, סבתא, נועה, אני. בואו נסיים את זה!"}],"swapLines":null},{"key":"end","title":"After the boss","hero":"shmuel","join":false,"ifPlayed":"keep","lines":[{"who":"boss","en":"Oof... take them... take them all...","he":"אוף... קחו אותן... קחו את כולן..."},{"who":"shmuel","en":"Every present back, every turrón accounted for.","he":"כל מתנה חזרה, כל טורון נספר."},{"who":"shmuel","en":"And there they are: Adi and Abir, out from behind the log, with gumballs for everyone.","he":"והנה הם: עדי ואביר, יוצאים מאחורי בול העץ, עם גומיות לכולם."},{"who":"pitz","en":"Purrrrrr. (Pitz is on Adi's shoulder. He is not coming down.)","he":"פרררררר. (פיץ על הכתף של עדי. הוא לא יורד.)"},{"who":"shmuel","en":"They were fine the whole way, just like I said. Rishon, Petah Tikva, Barcelona, Sant Cugat... all the way here.","he":"הם היו בסדר כל הדרך, בדיוק כמו שאמרתי. ראשון, פתח תקווה, ברצלונה, סאנט קוגאט... כל הדרך עד לכאן."},{"who":"shmuel","en":"And that is the whole game. Nothing here was real, except the fun. Thank you for playing, and well done.","he":"וזה כל המשחק. שום דבר פה לא היה אמיתי, חוץ מהכיף. תודה ששיחקתם, וכל הכבוד."},{"who":"shmuel","en":"If you want a sequel with more characters, just call me 🤘🏼♥️","he":"אם תרצו משחק המשך עם דמויות נוספות, פשוט תתקשרו אליי🤘🏼♥️"}],"swapLines":null}]}],"names":{"heroes":{"eviatar":{"en":"Eviatar","he":"אביתר"},"omri":{"en":"Omri","he":"עומרי"},"shmuel":{"en":"Shmuel","he":"שמואל"},"savta-orly":{"en":"Savta Orly","he":"סבתא אורלי"},"saba-kobi":{"en":"Saba Kobi","he":"סבא קובי"},"noa":{"en":"Noa","he":"נועה"}},"bosses":{"ferryman":"Ferryman","glass-warden":"Glass Warden","kilnheart":"Kilnheart","monk-zero":"Monk Zero","market-king":"Market King","railmaw":"Railmaw","crown-runner":"Crown Runner","the-null":"The Null","vault-mother":"Vault Mother","ultra-signal":"Ultra Signal","abyss-dragon":"Abyss Dragon","caga-tio":"Caga Tio","flame-samurai":"Flame Samurai","prism-queen":"Prism Queen","storm-colossus":"Storm Colossus"},"bossesHe":{"ferryman":"המעבורן","glass-warden":"שומר הזכוכית","kilnheart":"קילנהארט","monk-zero":"מונק זירו","market-king":"מלך השוק","railmaw":"ריילמו","crown-runner":"קראון ראנר","the-null":"האפס","vault-mother":"אם הכספת","ultra-signal":"אולטרה סיגנל","abyss-dragon":"דרקון התהום","caga-tio":"קאגה טיו","flame-samurai":"סמוראי הלהבה","prism-queen":"מלכת הפריזמה","storm-colossus":"ענק הסערה"},"pitz":{"en":"Pitz","he":"פיץ"}}}</script>
<script>
(function(){
  var SRC = JSON.parse(document.getElementById('data').textContent);
  var KEY = 'eviomri.dialog-sheet.edits';
  var SPEAKERS = ['hero','boss','pitz','player'];
  var edits = {};
  try { edits = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { edits = {}; }
  var root = document.getElementById('root'), status = document.getElementById('status'), out = document.getElementById('out');
  function heroName(id, lang){ var n = SRC.names.heroes[id]; return n ? n[lang] : id; }
  function bossName(id, lang){ return lang === 'he' ? (SRC.names.bossesHe[id] || id) : (SRC.names.bosses[id] || id); }
  function whoLabel(who, scene, lang){ return who === 'boss' ? bossName(scene.__boss, lang) : who === 'pitz' ? SRC.names.pitz[lang] : who === 'player' ? (lang === 'he' ? 'השחקן' : 'the player') : heroName(who, lang); }
  function path(level, scene, list, i, field){ return [level.id, scene.key, list, i, field].join('/'); }
  function val(p, orig){ return p in edits ? edits[p] : orig; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(edits)); } catch (e) {} status.textContent = Object.keys(edits).length + ' edited field(s) kept on this device'; }
  function render(){
    root.innerHTML = '';
    SRC.data.forEach(function(level){
      var box = document.createElement('section'); box.className = 'level';
      box.innerHTML = '<h2>Level ' + level.index + ' · ' + level.name[0] + ' · ' + level.name[1] + '</h2><div class="meta">' + level.waves + ' waves · boss: ' + bossName(level.boss, 'en') + '</div>';
      level.scenes.forEach(function(scene){
        scene.__boss = level.boss;
        var det = document.createElement('details'); det.open = level.index === 1;
        var flags = heroName(scene.hero, 'en') + ' walks in' + (scene.join ? ' · stays to fight' : '') + (scene.ifPlayed === 'swap' ? ' · stand-in if played' : '');
        det.innerHTML = '<summary>' + scene.title + '<span class="flags">' + flags + '</span></summary>';
        renderLines(det, level, scene, 'lines', scene.lines);
        if (scene.swapLines) {
          var sw = document.createElement('div'); sw.className = 'swap';
          sw.innerHTML = '<div class="hint">When the player already picked ' + heroName(scene.hero, 'en') + ': {new} = the stand-in, {old} = ' + heroName(scene.hero, 'en') + '</div>';
          renderLines(sw, level, scene, 'swapLines', scene.swapLines);
          det.appendChild(sw);
        }
        box.appendChild(det);
      });
      root.appendChild(box);
    });
  }
  function renderLines(parent, level, scene, list, lines){
    lines.forEach(function(line, i){
      var who = val(path(level, scene, list, i, 'who'), line.who === scene.hero ? 'hero' : line.who);
      var div = document.createElement('div'); div.className = 'line ' + who;
      var whoRow = document.createElement('div'); whoRow.className = 'who';
      var sel = document.createElement('select');
      SPEAKERS.forEach(function(s){ var o = document.createElement('option'); o.value = s; o.textContent = s === 'hero' ? heroName(scene.hero, 'en') : s === 'boss' ? bossName(level.boss, 'en') : s === 'pitz' ? 'Pitz' : 'the player'; if (s === who) o.selected = true; sel.appendChild(o); });
      sel.addEventListener('change', function(){ var p = path(level, scene, list, i, 'who'); var orig = line.who === scene.hero ? 'hero' : line.who; if (sel.value === orig) delete edits[p]; else edits[p] = sel.value; div.className = 'line ' + sel.value; save(); });
      whoRow.appendChild(sel);
      var n = document.createElement('span'); n.textContent = 'page ' + (i + 1); whoRow.appendChild(n);
      div.appendChild(whoRow);
      ['en','he'].forEach(function(lang){
        var ta = document.createElement('textarea'); ta.className = lang; ta.value = val(path(level, scene, list, i, lang), line[lang]);
        if (lang === 'he') ta.dir = 'rtl';
        if (ta.value !== line[lang]) ta.classList.add('dirty');
        ta.addEventListener('input', function(){ var p = path(level, scene, list, i, lang); if (ta.value === line[lang]) { delete edits[p]; ta.classList.remove('dirty'); } else { edits[p] = ta.value; ta.classList.add('dirty'); } save(); });
        div.appendChild(ta);
      });
      parent.appendChild(div);
    });
  }
  function exportJson(){
    var levels = SRC.data.map(function(level){ return { id: level.id, scenes: level.scenes.map(function(scene){
      var conv = function(list, lines){ return lines.map(function(line, i){ var who = val(path(level, scene, list, i, 'who'), line.who === scene.hero ? 'hero' : line.who); return { who: who === 'hero' ? scene.hero : who, en: val(path(level, scene, list, i, 'en'), line.en), he: val(path(level, scene, list, i, 'he'), line.he) }; }); };
      return { key: scene.key, hero: scene.hero, join: scene.join, ifPlayed: scene.ifPlayed, lines: conv('lines', scene.lines), swapLines: scene.swapLines ? conv('swapLines', scene.swapLines) : null };
    }) }; });
    return JSON.stringify({ version: 1, exported: new Date().toISOString(), edits: Object.keys(edits).length, levels: levels }, null, 1);
  }
  document.getElementById('export').addEventListener('click', function(){ out.value = exportJson(); out.scrollIntoView({ block: 'nearest' }); status.textContent = 'Exported: copy, share, or select the text below.'; });
  document.getElementById('copy').addEventListener('click', function(){ var t = out.value || exportJson(); out.value = t; if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ status.textContent = 'Copied to the clipboard.'; }, function(){ out.focus(); out.select(); status.textContent = 'Select the text and copy it.'; }); else { out.focus(); out.select(); status.textContent = 'Select the text and copy it.'; } });
  document.getElementById('share').addEventListener('click', function(){ var t = out.value || exportJson(); out.value = t; if (navigator.share) { var f; try { f = new File([t], 'eviomri-dialogs.json', { type: 'application/json' }); } catch (e) {} var payload = f && navigator.canShare && navigator.canShare({ files: [f] }) ? { files: [f], title: 'EviOmri dialogs' } : { title: 'EviOmri dialogs', text: t }; navigator.share(payload).catch(function(){}); } else status.textContent = 'Sharing is not available here — use Copy.'; });
  document.getElementById('reset').addEventListener('click', function(){ if (!confirm('Throw away every edit on this device?')) return; edits = {}; save(); render(); });
  function setLang(mode){ document.body.className = mode === 'both' ? '' : 'lang-' + mode; try { localStorage.setItem(KEY + '.lang', mode); } catch (e) {} }
  document.getElementById('langEn').addEventListener('click', function(){ setLang('en'); });
  document.getElementById('langHe').addEventListener('click', function(){ setLang('he'); });
  document.getElementById('langBoth').addEventListener('click', function(){ setLang('both'); });
  try { setLang(localStorage.getItem(KEY + '.lang') || 'both'); } catch (e) {}
  render(); save();
})();
</script>
